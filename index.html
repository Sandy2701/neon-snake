<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Snake - Multiplayer Edition</title>
    <style>
        body {
            background-color: #121214;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc;
            margin-bottom: 5px;
        }

        .scoreboard {
            display: flex;
            gap: 40px;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .p1-score { color: #00b3ff; text-shadow: 0 0 8px #00b3ff; }
        .p2-score { color: #ff007f; text-shadow: 0 0 8px #ff007f; }

        canvas {
            background-color: #1a1a1e;
            border: 4px solid #00ffcc;
            box-shadow: 0 0 20px #00ffcc;
            border-radius: 8px;
        }

        .controls-container {
            display: flex;
            gap: 50px;
            margin-top: 15px;
            color: #aaa;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>NEON SNAKE: VS MODE</h1>
    
    <div class="scoreboard">
        <div class="p1-score">P1 (Blue): <span id="p1Score">0</span></div>
        <div class="p2-score">P2 (Pink): <span id="p2Score">0</span></div>
    </div>
    
    <canvas id="gameCanvas" width="500" height="500"></canvas>

    <div class="controls-container">
        <div><b>Player 1 (Blue):</b><br>Use Arrow Keys</div>
        <div><b>Player 2 (Pink):</b><br>Use W, A, S, D Keys</div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // Player 1 State (Blue)
        let snake1 = [{x: 5, y: 12}];
        let xVel1 = 1;
        let yVel1 = 0;
        let score1 = 0;

        // Player 2 State (Pink)
        let snake2 = [{x: 20, y: 12}];
        let xVel2 = -1;
        let yVel2 = 0;
        let score2 = 0;

        let food = {x: 12, y: 12};
        let gameSpeed = 110;

        function main() {
            let gameOverReason = checkCollisions();
            if (gameOverReason) {
                alert(gameOverReason);
                resetGame();
                return;
            }

            clearCanvas();
            moveSnakes();
            drawFood();
            drawSnake(snake1, "#00ffcc", "#00b3ff"); // P1 Colors
            drawSnake(snake2, "#ff007f", "#ff66b2"); // P2 Colors
        }

        function clearCanvas() {
            ctx.fillStyle = "#1a1a1e";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake(snake, headColor, bodyColor) {
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? headColor : bodyColor;
                ctx.shadowBlur = 8;
                ctx.shadowColor = headColor;
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });
            ctx.shadowBlur = 0;
        }

        function moveSnakes() {
            // Move Player 1
            const head1 = {x: snake1[0].x + xVel1, y: snake1[0].y + yVel1};
            snake1.unshift(head1);
            if (head1.x === food.x && head1.y === food.y) {
                score1 += 10;
                document.getElementById("p1Score").innerText = score1;
                generateFood();
            } else {
                snake1.pop();
            }

            // Move Player 2
            const head2 = {x: snake2[0].x + xVel2, y: snake2[0].y + yVel2};
            snake2.unshift(head2);
            if (head2.x === food.x && head2.y === food.y) {
                score2 += 10;
                document.getElementById("p2Score").innerText = score2;
                generateFood();
            } else {
                snake2.pop();
            }
        }

        function drawFood() {
            ctx.fillStyle = "#ffff00"; // Yellow food for visibility
            ctx.shadowBlur = 12;
            ctx.shadowColor = "#ffff00";
            ctx.beginPath();
            let radius = (gridSize / 2) - 1;
            ctx.arc((food.x * gridSize) + radius, (food.y * gridSize) + radius, radius, 0, 2 * Math.PI);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
        }

        function checkCollisions() {
            const h1 = snake1[0];
            const h2 = snake2[0];

            // Wall Collisions
            if (h1.x < 0 || h1.x >= tileCount || h1.y < 0 || h1.y >= tileCount) return "Player 2 Wins! Player 1 hit a wall.";
            if (h2.x < 0 || h2.x >= tileCount || h2.y < 0 || h2.y >= tileCount) return "Player 1 Wins! Player 2 hit a wall.";

            // Head to Head Collision
            if (h1.x === h2.x && h1.y === h2.y) return "It's a Tie! Simultaneous head-on collision.";

            // Player 1 hitting themselves or Player 2
            for (let i = 1; i < snake1.length; i++) {
                if (h1.x === snake1[i].x && h1.y === snake1[i].y) return "Player 2 Wins! Player 1 hit themselves.";
            }
            for (let i = 0; i < snake2.length; i++) {
                if (h1.x === snake2[i].x && h1.y === snake2[i].y) return "Player 2 Wins! Player 1 crashed into Player 2.";
            }

            // Player 2 hitting themselves or Player 1
            for (let i = 1; i < snake2.length; i++) {
                if (h2.x === snake2[i].x && h2.y === snake2[i].y) return "Player 1 Wins! Player 2 hit themselves.";
            }
            for (let i = 0; i < snake1.length; i++) {
                if (h2.x === snake1[i].x && h2.y === snake1[i].y) return "Player 1 Wins! Player 2 crashed into Player 1.";
            }

            return null;
        }

        function resetGame() {
            snake1 = [{x: 5, y: 12}];
            xVel1 = 1; yVel1 = 0;
            score1 = 0;

            snake2 = [{x: 20, y: 12}];
            xVel2 = -1; yVel2 = 0;
            score2 = 0;

            document.getElementById("p1Score").innerText = 0;
            document.getElementById("p2Score").innerText = 0;
            generateFood();
        }

        // Key Listeners for both players
        document.addEventListener("keydown", (e) => {
            // Player 1 (Arrows)
            if (e.key === "ArrowLeft" && xVel1 !== 1)  { xVel1 = -1; yVel1 = 0; }
            if (e.key === "ArrowUp" && yVel1 !== 1)    { xVel1 = 0;  yVel1 = -1; }
            if (e.key === "ArrowRight" && xVel1 !== -1) { xVel1 = 1;  yVel1 = 0; }
            if (e.key === "ArrowDown" && yVel1 !== -1)  { xVel1 = 0;  yVel1 = 1; }

            // Player 2 (WASD)
            if ((e.key === "a" || e.key === "A") && xVel2 !== 1)  { xVel2 = -1; yVel2 = 0; }
            if ((e.key === "w" || e.key === "W") && yVel2 !== 1)  { xVel2 = 0;  yVel2 = -1; }
            if ((e.key === "d" || e.key === "D") && xVel2 !== -1) { xVel2 = 1;  yVel2 = 0; }
            if ((e.key === "s" || e.key === "S") && yVel2 !== -1)  { xVel2 = 0;  yVel2 = 1; }
        });

        setInterval(main, gameSpeed);
    </script>
</body>
</html>
