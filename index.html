<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Snake - Turbo Edition</title>
    <style>
        /* Modern, attractive dark arcade theme */
        body {
            background-color: #121214;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc;
            margin-bottom: 5px;
        }

        .stats-container {
            display: flex;
            gap: 30px;
            font-size: 20px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        #scoreLabel {
            color: #ff007f;
            text-shadow: 0 0 8px #ff007f;
        }

        #speedLabel {
            color: #ffff00;
            text-shadow: 0 0 8px #ffff00;
        }

        /* The Game Board */
        canvas {
            background-color: #1a1a1e;
            border: 4px solid #00ffcc;
            box-shadow: 0 0 20px #00ffcc;
            border-radius: 8px;
        }

        .instructions {
            margin-top: 15px;
            color: #888;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>NEON SNAKE: TURBO</h1>
    
    <div class="stats-container">
        <div id="scoreLabel">Score: <span id="score">0</span></div>
        <div id="speedLabel">Speed: <span id="speedLevel">1</span>x</div>
    </div>
    
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div class="instructions">
        Use your <b>Arrow Keys</b> to Move.<br>
        Watch out! It gets faster every time you eat!
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Grid configuration
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // Game Variables
        let snake = [{x: 10, y: 10}]; 
        let food = {x: 5, y: 5};
        let xVelocity = 0;
        let yVelocity = 0;
        let score = 0;
        
        let baseSpeed = 120; // Starting interval time in milliseconds
        let currentSpeed = baseSpeed;
        let speedLevel = 1;
        let gameTimeout;

        // Main game loop control using setTimeout for dynamic speed adjustments
        function main() {
            if (hasGameEnded()) {
                alert("Game Over! Your final score was: " + score);
                resetGame();
                return;
            }

            clearCanvas();
            moveSnake();
            drawFood();
            drawSnake();

            // Loops the game dynamically based on current speed
            gameTimeout = setTimeout(main, currentSpeed);
        }

        // 1. Clear Canvas every frame
        function clearCanvas() {
            ctx.fillStyle = "#1a1a1e";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // 2. Draw the Snake with a glowing neon effect
        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#00ffcc" : "#00b3ff";
                ctx.shadowBlur = 10;
                ctx.shadowColor = "#00ffcc";
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });
            ctx.shadowBlur = 0; 
        }

        // 3. Move the snake forward
        function moveSnake() {
            const head = {x: snake[0].x + xVelocity, y: snake[0].y + yVelocity};
            snake.unshift(head); 

            // Check if snake ate the food
            if (snake[0].x === food.x && snake[0].y === food.y) {
                score += 10;
                document.getElementById("score").innerText = score;
                
                // Increase speed difficulty level
                if (currentSpeed > 40) { 
                    currentSpeed -= 6; // Decreasing the delay makes it run faster
                    speedLevel += 1;
                    document.getElementById("speedLevel").innerText = speedLevel;
                }
                
                generateFood();
            } else {
                snake.pop(); 
            }
        }

        // 4. Draw Food (Neon Pink/Red)
        function drawFood() {
            ctx.fillStyle = "#ff007f";
            ctx.shadowBlur = 12;
            ctx.shadowColor = "#ff007f";
            ctx.beginPath();
            let radius = (gridSize / 2) - 1;
            ctx.arc((food.x * gridSize) + radius, (food.y * gridSize) + radius, radius, 0, 2 * Math.PI);
            ctx.fill();
            ctx.shadowBlur = 0; 
        }

        // 5. Spawn food randomly on the grid
        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);

            // Make sure food doesn't spawn on top of the snake
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) generateFood();
            });
        }

        // 6. Check for collisions (Walls or Self)
        function hasGameEnded() {
            // Self collision check
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }
            // Wall collision check
            const hitLeftWall = snake[0].x < 0;
            const hitRightWall = snake[0].x >= tileCount;
            const hitTopWall = snake[0].y < 0;
            const hitBottomWall = snake[0].y >= tileCount;

            return hitLeftWall || hitRightWall || hitTopWall || hitBottomWall;
        }

        // 7. Reset Game State
        function resetGame() {
            clearTimeout(gameTimeout);
            snake = [{x: 10, y: 10}];
            xVelocity = 0;
            yVelocity = 0;
            score = 0;
            currentSpeed = baseSpeed;
            speedLevel = 1;
            document.getElementById("score").innerText = score;
            document.getElementById("speedLevel").innerText = speedLevel;
            generateFood();
            main();
        }

        // 8. Capture Keyboard Inputs (Arrow Keys)
        document.addEventListener("keydown", changeDirection);

        function changeDirection(event) {
            const keyPressed = event.keyCode;
            const LEFT = 37;
            const UP = 38;
            const RIGHT = 39;
            const DOWN = 40;

            const goingUp = yVelocity === -1;
            const goingDown = yVelocity === 1;
            const goingRight = xVelocity === 1;
            const goingLeft = xVelocity === -1;

            if (keyPressed === LEFT && !goingRight) {
                xVelocity = -1;
                yVelocity = 0;
            }
            if (keyPressed === UP && !goingDown) {
                xVelocity = 0;
                yVelocity = -1;
            }
            if (keyPressed === RIGHT && !goingLeft) {
                xVelocity = 1;
                yVelocity = 0;
            }
            if (keyPressed === DOWN && !goingUp) {
                xVelocity = 0;
                yVelocity = 1;
            }
        }

        // Start the game loop
        generateFood();
        main();
    </script>
</body>
</html>
