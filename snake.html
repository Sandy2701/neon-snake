<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Neon Snake Game</title>
    <style>
        /* Modern, attractive dark arcade theme */
        body {
            background-color: #121214;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc;
            margin-bottom: 10px;
        }

        .score-container {
            font-size: 24px;
            margin-bottom: 15px;
            font-weight: bold;
            color: #ff007f;
            text-shadow: 0 0 8px #ff007f;
        }

        /* The Game Board */
        canvas {
            background-color: #1a1a1e;
            border: 4px solid #00ffcc;
            box-shadow: 0 0 20px #00ffcc;
            border-radius: 8px;
        }

        .instructions {
            margin-top: 15px;
            color: #888;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>NEON SNAKE</h1>
    <div class="score-container">Score: <span id="score">0</span></div>
    
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div class="instructions">
        Use your <b>Arrow Keys</b> to Move.<br>
        Don't hit the walls or yourself!
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Grid configuration (400x400 canvas divided into 20x20 blocks)
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // Game Variables
        let snake = [{x: 10, y: 10}]; // Start snake in the middle
        let food = {x: 5, y: 5};
        let xVelocity = 0;
        let yVelocity = 0;
        let score = 0;
        let gameSpeed = 100; // Lower is faster (100ms per frame)
        let gameInterval;

        // Main game loop control
        function main() {
            if (hasGameEnded()) {
                alert("Game Over! Your final score was: " + score);
                resetGame();
                return;
            }

            // Clear the board, move the snake, and draw everything
            clearCanvas();
            moveSnake();
            drawFood();
            drawSnake();
        }

        // 1. Clear Canvas every frame
        function clearCanvas() {
            ctx.fillStyle = "#1a1a1e";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // 2. Draw the Snake with a glowing neon effect
        function drawSnake() {
            snake.forEach((part, index) => {
                // Head is bright cyan, body has a slight gradient
                ctx.fillStyle = index === 0 ? "#00ffcc" : "#00b3ff";
                ctx.shadowBlur = 10;
                ctx.shadowColor = "#00ffcc";
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });
            ctx.shadowBlur = 0; // Reset shadow for other drawings
        }

        // 3. Move the snake forward based on velocity
        function moveSnake() {
            const head = {x: snake[0].x + xVelocity, y: snake[0].y + yVelocity};
            snake.unshift(head); // Add new head to front

            // Check if snake ate the food
            if (snake[0].x === food.x && snake[0].y === food.y) {
                score += 10;
                document.getElementById("score").innerText = score;
                generateFood();
            } else {
                snake.pop(); // Remove tail if it didn't eat food
            }
        }

        // 4. Draw Food (Neon Pink/Red)
        function drawFood() {
            ctx.fillStyle = "#ff007f";
            ctx.shadowBlur = 12;
            ctx.shadowColor = "#ff007f";
            ctx.beginPath();
            // Draw food as a neat circle
            let radius = (gridSize / 2) - 1;
            ctx.arc((food.x * gridSize) + radius, (food.y * gridSize) + radius, radius, 0, 2 * Math.PI);
            ctx.fill();
            ctx.shadowBlur = 0; // Reset shadow
        }

        // 5. Spawn food randomly on the grid
        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);

            // Make sure food doesn't spawn on top of the snake
            snake.forEach(part => {
                const hasEaten = part.x === food.x && part.y === food.y;
                if (hasEaten) generateFood();
            });
        }

        // 6. Check for collisions (Walls or Self)
        function hasGameEnded() {
            // Self collision check
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }
            // Wall collision check
            const hitLeftWall = snake[0].x < 0;
            const hitRightWall = snake[0].x >= tileCount;
            const hitToptWall = snake[0].y < 0;
            const hitBottomWall = snake[0].y >= tileCount;

            return hitLeftWall || hitRightWall || hitToptWall || hitBottomWall;
        }

        // 7. Reset Game State
        function resetGame() {
            snake = [{x: 10, y: 10}];
            xVelocity = 0;
            yVelocity = 0;
            score = 0;
            document.getElementById("score").innerText = score;
            generateFood();
        }

        // 8. Capture Keyboard Inputs (Arrow Keys)
        document.addEventListener("keydown", changeDirection);

        function changeDirection(event) {
            const keyPressed = event.keyCode;
            const LEFT = 37;
            const UP = 38;
            const RIGHT = 39;
            const DOWN = 40;

            // Prevent snake from reversing into itself
            const goingUp = yVelocity === -1;
            const goingDown = yVelocity === 1;
            const goingRight = xVelocity === 1;
            const goingLeft = xVelocity === -1;

            if (keyPressed === LEFT && !goingRight) {
                xVelocity = -1;
                yVelocity = 0;
            }
            if (keyPressed === UP && !goingDown) {
                xVelocity = 0;
                yVelocity = -1;
            }
            if (keyPressed === RIGHT && !goingLeft) {
                xVelocity = 1;
                yVelocity = 0;
            }
            if (keyPressed === DOWN && !goingUp) {
                xVelocity = 0;
                yVelocity = 1;
            }
        }

        // Start the game loop ticking
        setInterval(main, gameSpeed);
        generateFood();
    </script>
</body>
</html>
